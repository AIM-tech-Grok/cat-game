; Native PC test for sketch/sketch.ino. Lives under test-native/ so the App Lab
; root stays app.yaml, python/, and sketch/, matching the official example.

[env:native]
platform = native
test_framework = unity
; ArduinoFake 0.4.0 declares the arduino framework. This env is native only.
lib_compat_mode = off
lib_deps = fabiobatsilva/ArduinoFake@0.4.0
build_flags = -std=gnu++17
test_build_src = false
